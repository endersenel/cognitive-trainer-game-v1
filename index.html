<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>SPPLab - Performance Studio</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
header { background: #151515; padding: 6px 10px; text-align: center; border-bottom: 1px solid #333; flex-shrink: 0; }
h1 { margin: 0 0 6px 0; font-size: clamp(0.85rem, 3vw, 1.1rem); color: #00e5ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-bar { display: flex; gap: 4px; justify-content: center; align-items: center; width: 100%; flex-wrap: wrap; margin-bottom: 6px; }
.demo-field { display: flex; flex-direction: column; align-items: flex-start; }
.demo-field label { font-size: 0.6rem; color: #00e5ff; margin-bottom: 1px; font-weight: bold; }
.demo-field input, .demo-field select { background: #222; color: #fff; border: 1px solid #00e5ff; padding: 4px 5px; border-radius: 4px; font-size: clamp(0.65rem, 2vw, 0.75rem); outline: none; user-select: text; -webkit-user-select: text; }
.panel-row { display: flex; gap: 6px; justify-content: center; align-items: center; width: 100%; }
#module-select { background: #222; color: #fff; border: 1px solid #00e5ff; padding: 6px 8px; border-radius: 6px; font-size: clamp(0.7rem, 2.5vw, 0.85rem); outline: none; width: 100%; max-width: 450px; text-overflow: ellipsis; }
.extra-options { display: none; gap: 10px; justify-content: center; align-items: center; margin-top: 5px; font-size: 0.75rem; color: #00e5ff; }
.extra-options select { background: #222; color: #fff; border: 1px solid #00e5ff; padding: 2px 6px; border-radius: 4px; }
.consent-row { margin-top: 5px; font-size: 0.65rem; color: #aaa; display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
.consent-row input { accent-color: #00e5ff; }
#sync-status { color: #888; }
#stats-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 6px 12px; font-size: clamp(0.65rem, 2.2vw, 0.8rem); font-weight: bold; border-bottom: 1px solid #333; flex-shrink: 0; }
.stat-item { text-align: center; }
.stat-item span { color: #00e676; display: inline-block; }

#game-area { flex: 1; position: relative; width: 100%; overflow: hidden; background: #0e0e0e; display: flex; justify-content: center; align-items: center; padding: 10px; }
#game-area.has-buttons { padding-bottom: 90px; }
@keyframes fbok { 0% { box-shadow: inset 0 0 0 6px #00e676; } 100% { box-shadow: inset 0 0 0 0 transparent; } }
@keyframes fbbad { 0% { box-shadow: inset 0 0 0 6px #ff1744; } 100% { box-shadow: inset 0 0 0 0 transparent; } }
#game-area.fb-ok { animation: fbok .4s; }
#game-area.fb-bad { animation: fbbad .4s; }

#instruction-card { position: absolute; width: min(92%, 480px); max-height: 92%; overflow-y: auto; background: rgba(20,20,20,0.98); border: 2px solid #00e5ff; padding: 16px; border-radius: 12px; text-align: left; z-index: 1000; box-shadow: 0 0 20px rgba(0,229,255,0.2); user-select: text; -webkit-user-select: text; }
#instruction-card h3 { margin-top: 0; color: #00e5ff; font-size: clamp(0.95rem, 3.5vw, 1.2rem); text-align: center; }
#instruction-card p { font-size: clamp(0.72rem, 2.6vw, 0.85rem); line-height: 1.5; color: #ddd; margin-bottom: 6px; }
.eval-info { background: #181818; border-left: 3px solid #00e5ff; padding: 6px 8px; font-size: 0.72rem; color: #bbb; margin-top: 6px; border-radius: 0 4px 4px 0; }
.score-info { background: #111; border-left: 3px solid #00e676; padding: 6px 8px; font-size: 0.72rem; color: #aaa; margin-top: 6px; border-radius: 0 4px 4px 0; }
.legs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin-top: 6px; font-size: 0.72rem; background: #111; padding: 6px 8px; border-radius: 6px; }
.legs div { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 1px 0; }
.legs .best { color: #00e676; font-weight: bold; }
.legs .worst { color: #ff5252; font-weight: bold; }

#antisaccade-touch-zone { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 50; }
.antisaccade-half { position: absolute; width: 50%; height: 100%; top: 0; }
#antisaccade-left-zone { left: 0; border-right: 1px dashed rgba(255,255,255,0.1); }
#antisaccade-right-zone { right: 0; }

#dual-buttons { display: none; width: calc(100% - 20px); max-width: 400px; gap: 20px; justify-content: center; z-index: 100; position: absolute; bottom: 15px; }
.choice-btn { flex: 1; padding: 16px 0; font-size: 1rem; font-weight: bold; border-radius: 10px; border: 2px solid #fff; text-align: center; color: #fff; cursor: pointer; }
.btn-left { background: #ff1744; }
.btn-right { background: #29b6f6; }

#target-circle { position: absolute; transform: translate(-50%, -50%); width: clamp(100px, 25vw, 140px); height: clamp(100px, 25vw, 140px); border-radius: 50%; background: #000; border: 3px solid #fff; display: none; justify-content: center; align-items: center; font-size: clamp(1.2rem, 4vw, 1.8rem); font-weight: 900; box-shadow: 0 0 25px rgba(255,255,255,0.4); text-align: center; padding: 8px; z-index: 200; cursor: pointer; }
#target-circle.wide { width: auto; height: auto; min-width: 150px; border-radius: 18px; padding: 14px 22px; letter-spacing: 2px; white-space: nowrap; }

#spatial-grid { display: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; width: 100%; height: 100%; max-width: 500px; max-height: 500px; margin: auto; z-index: 100; }
#spatial-grid.compact { height: 52%; align-self: flex-end; }
.spatial-btn { border-radius: 12px; opacity: 0.3; transition: opacity 0.1s; display: flex; justify-content: center; align-items: center; font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 900; color: #000; border: 2px solid #fff; width: 100%; height: 100%; cursor: pointer; }
.spatial-btn.active { opacity: 1; box-shadow: 0 0 35px #fff; transform: scale(0.98); }
#spatial-grid.all-on .spatial-btn { opacity: 1; }

#memory-grid { display: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; width: min(70vw, 280px); aspect-ratio: 1; margin: auto; z-index: 100; }
.memory-block { background: #222; border: 2px solid #00e5ff; border-radius: 8px; width: 100%; height: 100%; cursor: pointer; }
.memory-block.lit { background: #00e5ff !important; box-shadow: 0 0 25px #00e5ff !important; }

#numpad-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(75vw, 260px); margin: auto; z-index: 100; }
.num-btn { background: #222; border: 1px solid #00e5ff; color: #fff; font-size: 1.2rem; font-weight: bold; padding: 12px 0; border-radius: 6px; text-align: center; cursor: pointer; }

#trail-area { display: none; position: relative; width: 100%; align-self: stretch; flex: 1; z-index: 100; }
#trail-area svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.trail-node { position: absolute; width: clamp(38px, 9vw, 46px); height: clamp(38px, 9vw, 46px); border-radius: 50%; background: #00e5ff; color: #000; font-weight: 900; font-size: clamp(0.85rem, 2.5vw, 1.1rem); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0,0,0,0.5); border: 2px solid #fff; z-index: 2; cursor: pointer; }
.trail-node.done { background: #00e676; opacity: 0.35; }

#controls { padding: 8px 12px; background: #151515; display: flex; gap: 8px; justify-content: center; flex-shrink: 0; border-top: 1px solid #333; width: 100%; }
button { flex: 1; max-width: 140px; min-height: 44px; padding: 10px 0; font-size: clamp(0.75rem, 2.5vw, 0.9rem); font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
.btn-start { background: #00c853; color: white; }
.btn-stop { background: #d50000; color: white; }
.btn-export { background: #0288d1; color: white; }
.btn-mute { background: #444; color: white; max-width: 80px; }
button:disabled { background: #333 !important; color: #666 !important; cursor: not-allowed; }

/* OYUN (GAMIFICATION) STİLLERİ */
#gm-bar{display:none;align-items:center;gap:8px;background:#101820;border-bottom:1px solid #1f3a4a;padding:4px 10px;font-size:.68rem;color:#9fd;flex-shrink:0}
#gm-bar.on{display:flex}
#gm-bar .lv{color:#ffd54f;font-weight:bold;white-space:nowrap}
#gm-xp{flex:1;height:6px;background:#223;border-radius:3px;overflow:hidden}
#gm-xp i{display:block;height:100%;width:0;background:#00e5ff;transition:width .4s}
#gm-combo{min-width:70px;text-align:right;color:#ffab40;font-weight:bold;opacity:0;transition:opacity .25s}
.gm-box{background:#101820;border:1px solid #1f3a4a;border-left:3px solid #ffab40;padding:8px 10px;margin-top:8px;font-size:.72rem;color:#cfe;line-height:1.5;text-align:left}
.gm-box b.h{display:block;color:#ffab40;margin-bottom:3px}
.gm-box .row{display:flex;justify-content:space-between;border-bottom:1px solid #1d2b35;padding:1px 0}
.gm-up{color:#ffd54f;font-weight:bold}
.gm-pb{color:#00e676;font-weight:bold}
#gm-overlay{display:none;position:fixed;inset:0;z-index:5200;background:#0a0a0a;overflow-y:auto;-webkit-overflow-scrolling:touch}
#gm-overlay.open{display:block}
#gm-overlay *{user-select:text;-webkit-user-select:text}
#gm-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;background:#151515;border-bottom:1px solid #333;padding:6px 10px;z-index:2}
#gm-top b{color:#ffab40}
#gm-top button{flex:none;min-height:36px;padding:6px 14px;background:#0288d1;max-width:none}
#gm-body{max-width:760px;margin:0 auto;padding:12px;font-size:.8rem;color:#ddd}
.gm-sec{border-top:1px solid #333;margin-top:14px;padding-top:8px}
.gm-sec h4{margin:0 0 6px;color:#ffab40;font-size:.9rem}
.gm-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:2px solid var(--tc,#cd7f32);background:#121212;padding:12px}
.gm-card .meta{flex:1;min-width:150px}
.gm-card .nm{font-size:1.1rem;font-weight:bold;color:var(--tc,#cd7f32)}
.gm-attr{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:6px;font-size:.74rem}
.gm-attr div{display:flex;justify-content:space-between;border-bottom:1px solid #222}
.gm-q{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:3px 0}
.gm-q.ok{color:#00e676}
.gm-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.gm-b{border:1px solid #333;padding:6px;background:#121212;font-size:.72rem;opacity:.4}
.gm-b.got{opacity:1;border-color:#ffd54f}
.gm-b b{color:#ffd54f;display:block}
.gm-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.gm-st{border:1px solid #333;background:#121212;padding:6px;font-size:.72rem;cursor:pointer;color:#ddd;text-align:left;min-height:0;max-width:none;font-weight:normal;border-radius:0}
.gm-st small{display:block;color:#888}
.gm-st .stars{color:#ffd54f;letter-spacing:2px}
.gm-note{color:#888;font-size:.68rem;margin-top:6px}
</style>
</head>
<body>

<header>
    <h1>SPPLab - Performance Studio</h1>
    <div class="demo-bar">
        <div class="demo-field"><label>Sporcu ID (takma)</label><input type="text" id="athlete-id" value="SP-101" maxlength="32" style="width: 85px;"></div>
        <div class="demo-field"><label>Yaş</label><input type="number" id="athlete-age" value="22" min="5" max="99" style="width: 45px;"></div>
        <div class="demo-field"><label>Cinsiyet</label><select id="athlete-gender" style="width: 65px;"><option value="Erkek">Erkek</option><option value="Kadin">Kadın</option></select></div>
        <div class="demo-field"><label>Branş</label><input type="text" id="athlete-sport" value="Futbol" maxlength="32" style="width: 70px;"></div>
        <div class="demo-field"><label>Baskın El</label><select id="athlete-dominant" style="width: 55px;"><option value="Sag">Sağ</option><option value="Sol">Sol</option></select></div>
        <div class="demo-field"><label>Spor Yılı</label><input type="number" id="athlete-exp" value="5" min="0" max="80" style="width: 55px;"></div>
    </div>

    <div class="panel-row">
        <select id="module-select">
            <optgroup label="A. Bilişsel İnhibisyon & Çatışma">
                <option value="gonogo">1. Go/No-Go (Baskılama)</option>
                <option value="stroop">2. Stroop (Renk-Kelime Çelişkisi)</option>
                <option value="simon">3. Simon Effect (Mekânsal Çatışma)</option>
                <option value="flanker">4. Flanker Testi (Çeldirici Dikkat)</option>
                <option value="antisaccade">5. Anti-Saccade (Refleks Baskılama)</option>
            </optgroup>
            <optgroup label="B. Nöropsikolojik & Bellek">
                <option value="trailA">6. Trail Making A (1-20 Sayı)</option>
                <option value="trailB">7. Trail Making B (1-A-2-B...)</option>
                <option value="memory">8. Görsel Dizilim Bellek (Corsi)</option>
                <option value="nback">9. Spatial N-Back Bellek</option>
                <option value="digit_span">10. Görsel Sayı Dizilimi Belleği</option>
            </optgroup>
            <optgroup label="C. Saha & Kinetik Depar">
                <option value="sprint_ball">11. Saha Depar: Top Getirme</option>
                <option value="agility_run">12. Renk Koni Çeviklik Deparı</option>
                <option value="complex_agility">13. Karmaşık Çift Komut Deparı (Go/No-Go)</option>
                <option value="choice_react">14. Çoklu Seçenek Reaksiyon Deparı</option>
                <option value="visual_search">15. Görsel Arama & Depar</option>
            </optgroup>
        </select>
    </div>

    <div class="extra-options" id="opt-digit">
        <label>Başlangıç uzunluğu: </label>
        <select id="digit-length-select"><option value="4">4 Basamak (Kolay)</option><option value="8">8 Basamak (Zor)</option></select>
    </div>
    <div class="extra-options" id="opt-nback">
        <label>N seviyesi: </label>
        <select id="nback-n-select"><option value="1">1-back</option><option value="2">2-back</option><option value="3">3-back</option></select>
    </div>

    <div class="consent-row">
        <label><input type="checkbox" id="consent"> Verilerimin araştırma amacıyla sunucuya gönderilmesine açık rıza veriyorum (kapalıysa veri sadece bu cihazda kalır).</label>
        <span id="sync-status"></span>
    </div>
</header>

<div id="gm-bar"><span class="lv" id="gm-lv">Sv.1</span><div id="gm-xp"><i></i></div><span id="gm-xptxt"></span><span id="gm-streak"></span><span id="gm-combo"></span></div>
<div id="gm-overlay"><div id="gm-top"><b>Antrenman Kampı</b><button id="gm-close">Kapat</button></div><div id="gm-body"></div></div>

<div id="stats-bar">
    <div class="stat-item">Deneme: <span id="stat-trials">0/10</span></div>
    <div class="stat-item">Sayaç: <span id="stat-timer">0.00 s</span></div>
    <div class="stat-item">Puan: <span id="stat-score">0</span></div>
    <div class="stat-item">Hata: <span id="stat-errors">0</span></div>
</div>

<div id="game-area">
    <div id="instruction-card">
        <h3 id="instr-title">Test Yönergesi</h3>
        <p id="instr-text">Test yükleniyor...</p>
        <div id="instr-eval" class="eval-info"></div>
        <div id="instr-score-formula" class="score-info"></div>
    </div>

    <div id="antisaccade-touch-zone">
        <div id="antisaccade-left-zone" class="antisaccade-half"></div>
        <div id="antisaccade-right-zone" class="antisaccade-half"></div>
    </div>

    <div id="target-circle"></div>

    <div id="dual-buttons">
        <div class="choice-btn btn-left" id="btn-left-opt">SOL</div>
        <div class="choice-btn btn-right" id="btn-right-opt">SAĞ</div>
    </div>

    <div id="spatial-grid">
        <div class="spatial-btn" data-key="red" style="background:#ff1744;"></div>
        <div class="spatial-btn" data-key="blue" style="background:#29b6f6;"></div>
        <div class="spatial-btn" data-key="green" style="background:#00e676;"></div>
        <div class="spatial-btn" data-key="yellow" style="background:#ffea00;"></div>
    </div>

    <div id="memory-grid"></div>
    <div id="numpad-grid"></div>
    <div id="trail-area"></div>
</div>

<div id="controls">
    <button id="start-btn" class="btn-start">Başlat</button>
    <button id="stop-btn" class="btn-stop" disabled>Durdur</button>
    <button id="export-btn" class="btn-export" disabled>CSV İndir</button>
    <button id="mute-btn" class="btn-mute">🔊 Ses</button>
</div>

<script>
/* ================== AYARLAR ================== */
const APP_VERSION = "2.1";
const API_URL = "";
const API_TOKEN = "";

/* ================== YARDIMCILAR ================== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const fmt = v => v == null ? "–" : Math.round(v);

const COLORS = {
    red:    { hex: '#ff1744', en: 'RED',    tr: 'KIRMIZI' },
    blue:   { hex: '#29b6f6', en: 'BLUE',   tr: 'MAVİ' },
    green:  { hex: '#00e676', en: 'GREEN',  tr: 'YEŞİL' },
    yellow: { hex: '#ffea00', en: 'YELLOW', tr: 'SARI' }
};
const KEYS = Object.keys(COLORS);
const SYMBOLS = ['▲', '●', '■', '★'];

/* ================== DOM ELEMANLARI ================== */
const moduleSelect = $('module-select'), circle = $('target-circle'), gameArea = $('game-area');
const zoneBox = $('antisaccade-touch-zone'), dualButtons = $('dual-buttons');
const btnLeft = $('btn-left-opt'), btnRight = $('btn-right-opt');
const spatialGrid = $('spatial-grid'), memoryGrid = $('memory-grid'), numpadGrid = $('numpad-grid'), trailArea = $('trail-area');
const instructionCard = $('instruction-card');
const startBtn = $('start-btn'), stopBtn = $('stop-btn'), exportBtn = $('export-btn'), muteBtn = $('mute-btn');
const statTrials = $('stat-trials'), statTimer = $('stat-timer'), statScore = $('stat-score'), statErrors = $('stat-errors');
const consentInput = $('consent');
const cones = [...document.querySelectorAll('.spatial-btn')];

/* ================== DURUM ================== */
const S = { mod: null, run: 0, active: false, waiting: false, rows: [], idx: 0, total: 10, practiceN: 0, t0: 0, clockStart: 0, resp: null, athlete: null, sessionId: '', ctx: {} };

const T = {
    ids: new Set(),
    set(fn, ms) {
        const run = S.run;
        const id = setTimeout(() => { T.ids.delete(id); if (run === S.run && S.active) fn(); }, ms);
        T.ids.add(id);
        return id;
    },
    clear() { T.ids.forEach(clearTimeout); T.ids.clear(); }
};

let clockInt = null;
function startClock() {
    stopClock();
    S.clockStart = performance.now();
    clockInt = setInterval(() => { statTimer.textContent = ((performance.now() - S.clockStart) / 1000).toFixed(2) + ' s'; }, 50);
}
function stopClock() { if (clockInt) clearInterval(clockInt); clockInt = null; }

/* ================== SES ================== */
let audioCtx = null, muted = false;
function initAudio() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
}
function beep(freq, dur = 0.15) {
    if (muted) return;
    try {
        initAudio();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
}
function speak(text) {
    if (muted) return;
    try {
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(text); m.lang = 'en-US';
            speechSynthesis.speak(m);
        }
    } catch (e) {}
}
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔇 Sessiz' : '🔊 Ses'; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); });

/* ================== WAKE LOCK ================== */
let wl = null;
async function requestWake() { try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
function releaseWake() { if (wl) { wl.release().catch(() => {}); wl = null; } }

/* ================== GÖRSEL YARDIMCILAR ================== */
function fb(ok) { gameArea.classList.remove('fb-ok', 'fb-bad'); void gameArea.offsetWidth; gameArea.classList.add(ok ? 'fb-ok' : 'fb-bad'); }

function setCircle(x, y, o = {}) {
    circle.className = o.wide ? 'wide' : '';
    circle.style.left = x + '%'; circle.style.top = y + '%';
    circle.style.backgroundColor = o.bg || '#000';
    circle.style.color = o.color || '#fff';
    circle.style.pointerEvents = o.events === false ? 'none' : 'auto';
    circle.textContent = o.text || '';
    circle.style.display = 'flex';
}
function setDual(l, r) { btnLeft.textContent = l; btnRight.textContent = r; dualButtons.style.display = 'flex'; gameArea.classList.add('has-buttons'); }
function setGrid({ labels = null, compact = false, allOn = false } = {}) {
    spatialGrid.style.display = 'grid';
    spatialGrid.classList.toggle('compact', compact);
    spatialGrid.classList.toggle('all-on', allOn);
    cones.forEach((c, i) => { c.textContent = labels ? labels[i] : ''; c.classList.remove('active'); });
}
function lightCone(key) { cones.forEach(c => c.classList.toggle('active', c.dataset.key === key)); }
function hideStim() {
    circle.style.display = 'none';
    zoneBox.style.display = 'none';
    dualButtons.style.display = 'none';
    gameArea.classList.remove('has-buttons');
    spatialGrid.style.display = 'none';
    memoryGrid.style.display = 'none';
    numpadGrid.style.display = 'none';

    cones.forEach(c => c.classList.remove('active'));
    memoryGrid.querySelectorAll('.lit').forEach(b => b.classList.remove('lit'));

/* ================== DENEME AKIŞI ================== */
function present(setup) {
    const run = S.run;
    setup();
    requestAnimationFrame(() => requestAnimationFrame(() => {
        if (run !== S.run || !S.active) return;
        S.t0 = performance.now(); S.waiting = true;
    }));
}
function delayThenPresent(setup) { T.set(() => present(setup), 500 + rnd(1300)); }

function rtFrom(ev) {
    const now = performance.now();
    const t = (ev && ev.timeStamp > 0 && ev.timeStamp <= now + 5) ? ev.timeStamp : now;
    return Math.max(0, Math.round(t - S.t0));
}
const isPractice = () => S.idx <= S.practiceN;

function record(o) {
    const p = S.athlete;
    const row = {
        sessionId: S.sessionId, timestamp: new Date().toISOString(), version: APP_VERSION,
        athleteId: p.id, age: p.age, gender: p.gender, sport: p.sport, dominantSide: p.dominant, experienceYears: p.exp,
        screen: p.screen, userAgent: p.ua,
        module: S.mod, trial: o.trial !== undefined ? o.trial : S.idx,
        practice: o.practice !== undefined ? (o.practice ? 1 : 0) : (isPractice() ? 1 : 0),
        condition: o.cond || '', response: o.resp || '',
        rt: o.rt == null ? null : o.rt, cum: o.cum == null ? null : o.cum,
        correct: o.correct ? 1 : 0, note: o.note || '', score: 0
    };
    S.rows.push(row);
    row.score = computeScore();
    updateStats();
}

function endTrial(o) {
    S.waiting = false; S.resp = null; T.clear();
    record(o);
    fb(o.correct);
    if (!o.correct) beep(150, 0.2);
    else beep(600, 0.1);
    hideStim();
    T.set(nextTrial, o.delay || 600);
}

function input(src, ev) {
    if (ev) {
        if (ev.cancelable) ev.preventDefault();
        ev.stopPropagation();
    }
    if (!S.active || !S.waiting || !S.resp) return;
    S.resp(src, ev);
}

function nextTrial() {
    const m = MODS[S.mod];
    if ((m.over && m.over()) || (!m.open && S.idx >= S.practiceN + S.total)) { finishTest(); return; }
    S.idx++; S.waiting = false;
    if (!m.open) statTrials.textContent = isPractice() ? `Pratik ${S.idx}/${S.practiceN}` : `${S.idx - S.practiceN}/${S.total}`;
    m.trial();
}

/* ================== PUANLAMA ================== */
const okRows = r => r.filter(x => x.correct);
const errCount = r => r.filter(x => !x.correct).length;
const meanRT = r => mean(r.filter(x => x.correct && x.rt != null).map(x => x.rt));
const scRT = div => r => (okRows(r).length / (r.length || 1)) * 1000 - (meanRT(r) || 0) / div - errCount(r) * 20;

function zinv(p) {
    const t = Math.sqrt(-2 * Math.log(p < 0.5 ? p : 1 - p));
    const x = t - (2.515517 + 0.802853 * t + 0.010328 * t * t) / (1 + 1.432788 * t + 0.189269 * t * t + 0.001308 * t * t * t);
    return p < 0.5 ? -x : x;
}
function nbackStats(r) {
    const m = r.filter(x => x.condition === 'MATCH'), n = r.filter(x => x.condition === 'NONMATCH');
    const hits = m.filter(x => x.response === 'MATCH').length, fa = n.filter(x => x.response === 'MATCH').length;
    const H = (hits + 0.5) / (m.length + 1), F = (fa + 0.5) / (n.length + 1);
    return { hits, nM: m.length, fa, nN: n.length, d: zinv(H) - zinv(F) };
}
const TRAIL_LEN = 20;
function trailStats(r) {
    const legs = r.filter(x => x.correct && x.condition === 'REAL');
    const done = legs.length >= TRAIL_LEN;
    return { legs, sec: done ? legs[legs.length - 1].cum / 1000 : null, err: r.filter(x => !x.correct).length };
}
function trailLegsHtml(legs) {
    if (!legs.length) return '';
    const rts = legs.map(l => l.rt), best = Math.min(...rts), worst = Math.max(...rts);
    const items = legs.map(l => {
        const cls = l.rt === best ? 'best' : l.rt === worst ? 'worst' : '';
        return `<div class="${cls}"><span>${l.note}</span><span>${(l.rt / 1000).toFixed(2)} sn</span></div>`;
    }).join('');
    return `<b>Hedefler arası süreler:</b><div class="legs">${items}</div>`;
}
function spanOf(r) { return Math.max(0, ...okRows(r).map(x => parseInt(x.condition.slice(1)) || 0)); }

function computeScore() {
    const r = S.rows.filter(x => !x.practice);
    if (!r.length) return 0;
    return Math.max(0, Math.round(MODS[S.mod].score(r)));
}
function updateStats() {
    statErrors.textContent = S.rows.filter(x => !x.practice && !x.correct).length;
    statScore.textContent = computeScore();
}
function condEffect(r) {
    const c = meanRT(r.filter(x => x.condition === 'CONGRUENT')), i = meanRT(r.filter(x => x.condition === 'INCONGRUENT'));
    return [`Uyumlu ort. RT: ${fmt(c)} ms`, `Uyumsuz ort. RT: ${fmt(i)} ms`, `Etki (uyumsuz − uyumlu): ${c != null && i != null ? Math.round(i - c) + ' ms' : '–'}`];
}

/* ================== TRAIL, MEMORY, NUMPAD ÖZEL MANTIKLARI ================== */
function initTrail(isB) {
    trailArea.innerHTML = ''; trailArea.style.display = 'block';
    const seq = isB ? ['1','A','2','B','3','C','4','D','5','E','6','F','7','G','8','H','9','I','10','J'] : Array.from({length:20}, (_,i)=>(i+1).toString());
    S.ctx.seq = seq; S.ctx.step = 0; S.ctx.tStart = performance.now(); S.ctx.lastT = performance.now();

    const positions = [];
    for (let i = 0; i < seq.length; i++) {
        let x, y, overlap;
        let attempts = 0;
        do {
            overlap = false;
            x = 5 + rnd(82);
            y = 5 + rnd(82);
            for (let p of positions) {
                if (Math.hypot(p.x - x, p.y - y) < 14) { overlap = true; break; }
            }
            attempts++;
        } while (overlap && attempts < 100);
        positions.push({x, y});

        const node = document.createElement('div');
        node.className = 'trail-node';
        node.style.left = x + '%'; node.style.top = y + '%';
        node.textContent = seq[i];
        node.dataset.idx = i;
        
        const handleNodeInput = (e) => {
            if (e.cancelable) e.preventDefault();
            if (!S.active) return;
            const idx = parseInt(node.dataset.idx);
            const now = performance.now();
            if (idx === S.ctx.step) {
                node.classList.add('done');
                const legRt = Math.round(now - S.ctx.lastT);
                const cum = Math.round(now - S.ctx.tStart);
                S.ctx.lastT = now;
                record({ trial: idx + 1, practice: 0, cond: 'REAL', resp: seq[idx], rt: legRt, cum: cum, correct: 1, note: `Hedef ${seq[idx]}` });
                S.ctx.step++;
                beep(600, 0.08);
                if (S.ctx.step >= seq.length) finishTest();
            } else {
                record({ trial: S.ctx.step + 1, practice: 0, cond: 'REAL', resp: seq[idx], rt: 0, cum: Math.round(now - S.ctx.tStart), correct: 0, note: `Hata: ${seq[idx]} tıklandı` });
                beep(150, 0.2);
                fb(false);
            }
        };

        node.addEventListener('pointerdown', handleNodeInput);
        trailArea.appendChild(node);
    }
    S.t0 = performance.now();
    S.active = true;
}

function initMemoryGrid() {
    memoryGrid.innerHTML = ''; memoryGrid.style.display = 'grid';
    for (let i = 0; i < 9; i++) {
        const b = document.createElement('div');
        b.className = 'memory-block';
        b.dataset.idx = i;
        const handleMemInput = (e) => {
            if (e.cancelable) e.preventDefault();
            input(`mem:${i}`, e);
        };
        b.addEventListener('pointerdown', handleMemInput);
        memoryGrid.appendChild(b);
    }
}

function playMemorySequence() {
    const blocks = [...memoryGrid.children];
    const len = S.ctx.len;
    const seq = Array.from({length: len}, () => rnd(9));
    S.ctx.seq = seq; S.ctx.user = [];

    let i = 0;
    S.waiting = false;
    const interval = setInterval(() => {
        if (!S.active) { clearInterval(interval); return; }
        if (i > 0) blocks[seq[i-1]].classList.remove('lit');
        if (i < len) {
            blocks[seq[i]].classList.add('lit');
            beep(400 + seq[i] * 50, 0.2);
            i++;
        } else {
            clearInterval(interval);
            S.t0 = performance.now();
            S.waiting = true;
            S.resp = (src) => {
                if (!src.startsWith('mem:')) return;
                const idx = parseInt(src.slice(4));
                S.ctx.user.push(idx);
                blocks[idx].classList.add('lit');
                T.set(() => blocks[idx].classList.remove('lit'), 150);
                beep(500, 0.1);

                const currentStep = S.ctx.user.length - 1;
                if (S.ctx.user[currentStep] !== seq[currentStep]) {
                    endTrial({ correct: false, note: `Yanlış Dizi (Sırada ${S.ctx.len})`, cond: `L${S.ctx.len}`, resp: 'FAIL' });
                    S.ctx.len = Math.max(3, S.ctx.len - 1);
                } else if (S.ctx.user.length === seq.length) {
                    endTrial({ correct: true, note: `Doğru Dizi (Sırada ${S.ctx.len})`, cond: `L${S.ctx.len}`, resp: 'SUCCESS' });
                    S.ctx.len++;
                }
            };
        }
    }, 600);
}

function initNumpad() {
    numpadGrid.innerHTML = ''; numpadGrid.style.display = 'grid';
    for (let i = 1; i <= 9; i++) {
        const b = document.createElement('div');
        b.className = 'num-btn'; b.textContent = i;
        const handleNumInput = (e) => {
            if (e.cancelable) e.preventDefault();
            input(`num:${i}`, e);
        };
        b.addEventListener('pointerdown', handleNumInput);
        numpadGrid.appendChild(b);
    }
}

function playDigitSequence() {
    const len = S.ctx.len;
    const seq = Array.from({length: len}, () => rnd(9) + 1);
    S.ctx.seq = seq; S.ctx.user = [];
    let i = 0;
    S.waiting = false;

    const interval = setInterval(() => {
        if (!S.active) { clearInterval(interval); return; }
        if (i < len) {
            setCircle(50, 42, { bg: '#222', color: '#00e5ff', text: seq[i], events: false });
            beep(500, 0.15);
            i++;
        } else {
            clearInterval(interval);
            circle.style.display = 'none';
            numpadGrid.style.display = 'grid';
            S.t0 = performance.now();
            S.waiting = true;

            S.resp = (src) => {
                if (!src.startsWith('num:')) return;
                const num = parseInt(src.slice(4));
                S.ctx.user.push(num);
                beep(600, 0.08);

                const step = S.ctx.user.length - 1;
                if (S.ctx.user[step] !== seq[step]) {
                    endTrial({ correct: false, note: `Yanlış Sayı (Uzunluk ${S.ctx.len})`, cond: `L${S.ctx.len}`, resp: S.ctx.user.join('') });
                    S.ctx.len = Math.max(3, S.ctx.len - 1);
                } else if (S.ctx.user.length === seq.length) {
                    endTrial({ correct: true, note: `Doğru Dizilim (Uzunluk ${S.ctx.len})`, cond: `L${S.ctx.len}`, resp: S.ctx.user.join('') });
                    S.ctx.len++;
                }
            };
        }
    }, 800);
}

/* ================== ARAYÜZ VE ETKİNLİK DİNLENİCİLERİ ================== */
function updateModuleUI() {
    const key = moduleSelect.value;
    const m = MODS[key];

    $('instr-title').textContent = m.title;
    $('instr-text').textContent = m.text;

    instructionCard.style.display = 'block';

    $('opt-digit').style.display = key === 'digit_span' ? 'flex' : 'none';

}

moduleSelect.addEventListener('change', updateModuleUI);

const addMultiListener = (el, fn) => {
    if(!el) return;
    el.addEventListener('pointerdown', fn);
    el.addEventListener('click', fn);
};

addMultiListener(circle, e => input('circle', e));
addMultiListener(btnLeft, e => input('left', e));
addMultiListener(btnRight, e => input('right', e));

/* ================== TEST BAŞLAT / DURDUR ================== */
function startTest() {
    S.mod = moduleSelect.value;
    const m = MODS[S.mod];
    if (!m) return;

    S.run++;
    S.active = true;
    S.waiting = false;
    S.rows = [];
    S.idx = 0;
    S.practiceN = m.practice || 0;
    S.total = m.total || 10;
    S.sessionId = 'S_' + Date.now();
    S.athlete = {
        id: $('athlete-id').value || 'SP-101',
        age: $('athlete-age').value,
        gender: $('athlete-gender').value,
        sport: $('athlete-sport').value,
        dominant: $('athlete-dominant').value,
        exp: $('athlete-exp').value,
        screen: `${window.innerWidth}x${window.innerHeight}`,
        ua: navigator.userAgent
    };

    instructionCard.style.display = 'none';
    startBtn.disabled = true;
    stopBtn.disabled = false;
    exportBtn.disabled = true;
    moduleSelect.disabled = true;

    requestWake();
    startClock();
    updateStats();

    if (m.setup) m.setup();
    nextTrial();
}

function stopTest() {
    S.active = false;
    S.waiting = false;
    T.clear();
    stopClock();
    releaseWake();
    hideStim();

    startBtn.disabled = false;
    stopBtn.disabled = true;
    exportBtn.disabled = S.rows.length === 0;
    moduleSelect.disabled = false;
    instructionCard.style.display = 'block';
}

function finishTest() {
    stopTest();
    beep(800, 0.3);
    const m = MODS[S.mod];
    const realRows = S.rows.filter(x => !x.practice);
    let summaryHtml = `<b>TEST TAMAMLANDI!</b><br>Toplam Puan: ${computeScore()}<br>`;
    if (m.extra) summaryHtml += '<br>' + m.extra(realRows).join('<br>');
    if (S.mod === 'trailA' || S.mod === 'trailB') summaryHtml += '<br>' + trailLegsHtml(realRows);

    $('instr-title').textContent = m.title + " - Sonuçlar";
    $('instr-text').innerHTML = summaryHtml;
    
    if (consentInput && consentInput.checked && API_URL) sendDataToServer();
}

startBtn.addEventListener('click', startTest);
stopBtn.addEventListener('click', stopTest);

/* ================== CSV DIŞA AKTAR / SUNUCU ================== */
exportBtn.addEventListener('click', () => {
    if (!S.rows.length) return;
    const headers = Object.keys(S.rows[0]).join(',');
    const csvRows = S.rows.map(r => Object.values(r).map(v => `"${v}"`).join(','));
    const csvContent = "data:text/csv;charset=utf-8," + [headers, ...csvRows].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `SPPLab_${S.mod}_${S.athlete.id}_${Date.now()}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
});

async function sendDataToServer() {
    if (!API_URL) return;
    $('sync-status').textContent = "Gönderiliyor...";
    try {
        const resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: API_TOKEN, rows: S.rows })
        });
        if (resp.ok) $('sync-status').textContent = "Senkronize Edildi ✓";
        else $('sync-status').textContent = "Hata!";
    } catch (e) {
        $('sync-status').textContent = "Bağlantı Hatası";
    }
}

/* ================== GAMIFICATION (OYUN SİSTEMİ) KODLARI ================== */
(function(){
'use strict';
var KEY='spplab_game_v1', ONKEY='spplab_gm_on';
var on = localStorage.getItem(ONKEY) === '1';
var combo = 0, maxCombo = 0;

function loadAll(){ try{ return JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ return {}; } }
function saveAll(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
function getP(id){ var d=loadAll(); if(!d[id]) d[id]={xp:0,badges:{},pb:{},best:{},done:{},sess:[],claimed:{},pbCount:0}; return {d:d, p:d[id]}; }
function curId(){ var e=document.getElementById('athlete-id'); return e?e.value.trim():'SP-101'; }
function h(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function dayIdx(t){ return Math.floor((t - new Date(t).getTimezoneOffset()*60000)/864e5); }
function weekIdx(t){ return Math.floor((dayIdx(t)+3)/7); }
function lvOf(xp){ var L=1; while(xp>=100*L*L) L++; return L; }
function lvBase(L){ return 100*(L-1)*(L-1); }
function tierOf(L){ return L<4?['Bronz','#cd7f32']:L<8?['Gümüş','#c0c0c0']:L<12?['Altın','#ffd54f']:['Elmas','#80deea']; }
function streakOf(p){ var ws={}; p.sess.forEach(function(s){if(s.q)ws[weekIdx(s.t)]=1;}); var w=weekIdx(Date.now()),n=0; if(!ws[w])w--; while(ws[w]){n++;w--;} return n; }

var CATS=[
    {k:'Hız',re:/^(gonogo|sprint_ball|choice_react)$/i,st:'Refleks Arenası'},
    {k:'Kontrol',re:/^(stroop|simon|antisaccade)$/i,st:'Kontrol Kulesi'},
    {k:'Esneklik',re:/^(trailA|trailB)$/i,st:'Strateji Odası'},
    {k:'Bellek',re:/^(memory|nback|digit_span)$/i,st:'Hafıza Kasası'},
    {k:'Dikkat',re:/^(flanker|visual_search)$/i,st:'Radar İstasyonu'},
    {k:'Zamanlama',re:/^(agility_run|complex_agility)$/i,st:'Ritim Pisti'}
];
function catOf(m){ for(var i=0;i<CATS.length;i++) if(CATS[i].re.test(m)) return CATS[i]; return CATS[4]; }

function quality(r){
    var need = S.open ? 1 : Math.max(5, Math.round(S.total * 0.6));
    if(r.length < need) return {ok:false, why:'Çok az deneme tamamlandı'};
    return {ok:true};
}

function quests(p){
    var now=Date.now(), d=dayIdx(now), w=weekIdx(now);
    var ds=p.sess.filter(function(s){return s.q && dayIdx(s.t)===d;});
    var ws=p.sess.filter(function(s){return s.q && weekIdx(s.t)===w;});
    var u={}, c={}; ws.forEach(function(s){ u[s.m]=1; c[catOf(s.m).k]=1; });
    return[
        {key:'d'+d+':D', t:'Bugün 1 geçerli seans tamamla', v:ds.length, g:1, xp:20},
        {key:'w'+w+':A', t:'Bu hafta 3 farklı test yap', v:Object.keys(u).length, g:3, xp:60},
        {key:'w'+w+':B', t:'Bu hafta 1 geçerli seans yap', v:ws.length, g:1, xp:60},
        {key:'w'+w+':C', t:'Bu hafta 3 farklı kategoride test yap', v:Object.keys(c).length, g:3, xp:60}
    ];
}

var BADGES=[
    {id:'ilk', n:'İlk Adım', d:'İlk geçerli seansı tamamla', t:function(c){return c.q.ok;}},
    {id:'kus', n:'Kusursuz', d:'Bir seansta %100 doğruluk sağla', t:function(c){return c.q.ok && c.r.length>=5 && c.r.every(function(x){return x.correct;});}},
    {id:'seri3', n:'Düzenli', d:'3 haftalık seri yap', t:function(c){return c.streak>=3;}},
    {id:'sv5', n:'Kıdemli', d:'Seviye 5 e ulaş', t:function(c){return c.lv>=5;}}
];

function refreshBar(){
    var bar=document.getElementById('gm-bar'), btn=document.getElementById('gm-btn');
    if(bar) bar.classList.toggle('on', on);
    if(btn) btn.style.display = on ? '' : 'none';
    if(!on) return;
    var id=curId(), p=getP(id).p, L=lvOf(p.xp), b=lvBase(L), n=lvBase(L+1);
    document.getElementById('gm-lv').textContent = 'Sv.' + L + ' ' + tierOf(L)[0];
    document.querySelector('#gm-xp i').style.width = Math.min(100, Math.max(0, (p.xp-b)/(n-b)*100)) + '%';
    document.getElementById('gm-xptxt').textContent = p.xp + '/' + n + ' XP';
    document.getElementById('gm-streak').textContent = 'Seri: ' + streakOf(p) + ' hf';
}

var comboTimer = null;
function showCombo(ok){
    if(ok){ combo++; if(combo > maxCombo) maxCombo = combo; } else combo = 0;
    var el = document.getElementById('gm-combo'); if(!el) return;
    if(combo >= 3){ el.textContent = 'Seri x' + combo; el.style.opacity = 1; if(combo%5===0) beep(880, 0.08); }
    else el.style.opacity = 0;
    clearTimeout(comboTimer); comboTimer = setTimeout(function(){ el.style.opacity = 0; }, 700);
}

function reward(){
    var a = S.athlete; if(!a) return;
    var r = S.rows.filter(function(x){ return !x.practice; }); if(!r.length) return;
    var g = getP(a.id), p = g.p, mod = S.mod, now = Date.now();
    var q = quality(r);
    var score = computeScore(), xp = 0, lines = [], pbTxt = '', newB = [], lvBefore = lvOf(p.xp);
    
    if(q.ok){
        xp += 100; lines.push(['Seans Tamamlama', 100]);
        if(!p.done[mod]){ xp += 30; lines.push(['Yeni İstasyon', 30]); }
    } else {
        xp += 10; lines.push(['Katılım', 10]);
    }

    if(q.ok){
        var old = p.best[mod] || 0;
        if(score > old){ p.best[mod] = score; p.pbCount++; pbTxt = 'YENİ KİŞİSEL REKOR: ' + score; }
        else { pbTxt = 'En iyi puanın: ' + old; }
    }

    p.sess.push({m:mod, r:0, t:now, q:q.ok?1:0});
    if(p.sess.length > 300) p.sess = p.sess.slice(-300);
    p.done[mod] = (p.done[mod] || 0) + (q.ok ? 1 : 0);

    quests(p).forEach(function(x){
        if(x.v >= x.g && !p.claimed[x.key]){ p.claimed[x.key] = 1; xp += x.xp; lines.push(['Görev: ' + x.t, x.xp]); }
    });

    var ctx = {p:p, r:r, q:q, streak:streakOf(p), lv:lvOf(p.xp + xp)};
    BADGES.forEach(function(bd){
        if(!p.badges[bd.id]){
            var ok = false; try{ ok = bd.t(ctx); }catch(e){}
            if(ok){ p.badges[bd.id] = now; newB.push(bd); xp += 20; lines.push(['Rozet: ' + bd.n, 20]); }
        }
    });

    p.xp += xp;
    saveAll(g.d);
    var lvAfter = lvOf(p.xp);

    var html = '<div class="gm-box gm-reward"><b class="h">Seans Ödülü: +' + xp + ' XP</b>' +
        lines.map(function(l){ return '<div class="row"><span>' + h(l[0]) + '</span><span>+' + l[1] + '</span></div>'; }).join('');
    if(pbTxt) html += '<div style="margin-top:4px" class="gm-pb">' + pbTxt + '</div>';
    if(newB.length) html += '<div style="margin-top:4px" class="gm-up">Yeni Rozet: ' + newB.map(function(b){ return h(b.n); }).join(', ') + '</div>';
    if(lvAfter > lvBefore) html += '<div class="gm-up" style="margin-top:4px">SEVİYE ATLADIN: Sv.' + lvAfter + '</div>';
    html += '</div>';

    Array.prototype.forEach.call(instructionCard.querySelectorAll('.gm-box'), function(e){ e.remove(); });
    instructionCard.insertAdjacentHTML('beforeend', html);
    refreshBar();
}

window.missionBox = function(){
    Array.prototype.forEach.call(instructionCard.querySelectorAll('.gm-box'), function(e){ e.remove(); });
    if(!on) return;
    var mod = moduleSelect.value, c = catOf(mod), p = getP(curId()).p;
    var html = '<div class="gm-box"><b class="h">İstasyon: ' + c.st + ' (' + c.k + ')</b>' +
        'Görev: Testi tamamla. Ödül: 100 XP' + (p.done[mod] ? '' : ' + 30 XP (Yeni İstasyon)') + '.<br>' +
        (p.best[mod] ? 'En İyi Puanın: ' + p.best[mod] : 'Henüz skor kaydın yok.') +
        '</div>';
    instructionCard.insertAdjacentHTML('beforeend', html);
};

/* --- Güvenli Fonksiyon Kapsama Bağlayıcıları --- */
var _origFinishTest = finishTest;
finishTest = function() {
    _origFinishTest();
    if(on) { try{ reward(); }catch(e){} }
};

var _origEndTrial = endTrial;
endTrial = function(o) {
    _origEndTrial(o);
    if(on && S.active) {
        try{
            var pr = o.practice !== undefined ? o.practice : isPractice();
            if(!pr) showCombo(!!o.correct);
        }catch(e){}
    }
};

var _origStartTest = startTest;
startTest = function() {
    combo = 0; maxCombo = 0;
    _origStartTest();
};

/* Arayüz Elemanlarını Oluşturma */
var row = document.querySelector('.consent-row');
if(row) row.insertAdjacentHTML('afterbegin', '<label style="color:#ffab40; margin-right:10px;"><input type="checkbox" id="gm-toggle"> Oyun Modu</label>');
var tg = document.getElementById('gm-toggle');
if(tg){
    tg.checked = on;
    tg.addEventListener('change', function(){
        on = tg.checked;
        localStorage.setItem(ONKEY, on ? '1' : '0');
        refreshBar();
        updateModuleUI();
    });
}

var bar = document.getElementById('gm-bar'), hd = document.querySelector('header');
if(hd && bar) hd.insertAdjacentElement('afterend', bar);

var ctl = document.getElementById('controls');
if(ctl){
    var gb = document.createElement('button');
    gb.id = 'gm-btn';
    gb.className = 'btn-mute';
    gb.style.background = '#ef6c00';
    gb.textContent = 'Kamp';
    ctl.insertBefore(gb, document.getElementById('mute-btn'));
    gb.addEventListener('click', openCamp);
}

document.getElementById('gm-close').addEventListener('click', function(){
    document.getElementById('gm-overlay').classList.remove('open');
});

function stars(p, m){
    var n = p.done[m] || 0;
    return n >= 3 ? '★★★' : n >= 1 ? '★☆☆' : '☆☆☆';
}

function openCamp(){
    if(S.active) return;
    var id = curId();
    var p = getP(id).p, L = lvOf(p.xp), t = tierOf(L), streak = streakOf(p);
    
    var html = '<div class="gm-card" style="--tc:' + t[1] + '"><div class="meta"><div class="nm">' + h(id) + '</div>' +
        '<div>' + t[0] + ' · Seviye ' + L + ' · ' + p.xp + ' XP</div>' +
        '<div>Haftalık Seri: ' + streak + ' Hafta</div></div></div>';

    html += '<div class="gm-sec"><h4>Görevler</h4>' + quests(p).map(function(x){
        var d = x.v >= x.g;
        return '<div class="gm-q' + (d ? ' ok' : '') + '"><span>' + h(x.t) + '</span><span>' + Math.min(x.v, x.g) + '/' + x.g + ' · ' + x.xp + ' XP' + (d ? ' ✓' : '') + '</span></div>';
    }).join('') + '</div>';

    html += '<div class="gm-sec"><h4>Rozetler (' + Object.keys(p.badges).length + '/' + BADGES.length + ')</h4><div class="gm-badges">' + BADGES.map(function(b){
        return '<div class="gm-b' + (p.badges[b.id] ? ' got' : '') + '"><b>' + h(b.n) + '</b>' + h(b.d) + '</div>';
    }).join('') + '</div></div>';

    html += '<div class="gm-sec"><h4>İstasyon Haritası</h4><div class="gm-map">' + Object.keys(MODS).map(function(m){
        var c = catOf(m);
        return '<button class="gm-st" data-m="' + m + '"><span class="stars">' + stars(p, m) + '</span><br>' + h(MODS[m].title) + '<small>' + c.st + (p.best[m] ? ' · En İyi: ' + p.best[m] : '') + '</small></button>';
    }).join('') + '</div></div>';

    var body = document.getElementById('gm-body');
    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll('.gm-st'), function(b){
        b.addEventListener('click', function(){
            moduleSelect.value = b.getAttribute('data-m');
            updateModuleUI();
            document.getElementById('gm-overlay').classList.remove('open');
        });
    });

    document.getElementById('gm-overlay').classList.add('open');
}

// İlk Çalıştırma
updateModuleUI();
refreshBar();
})();
</script>
