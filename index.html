<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0e15">
<title>NEURO-CORE // Bilişsel Performans Laboratuvarı</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');

:root {
  --neon-cyan: #00f3ff;
  --neon-magenta: #ff0055;
  --neon-green: #00ff66;
  --neon-yellow: #ffcc00;
  --bg-dark: #08090f;
  --panel-bg: rgba(16, 20, 31, 0.85);
  --border-glow: rgba(0, 243, 255, 0.3);
}

* { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--bg-dark); color: #eceff4; font-family: 'Rajdhani', -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden; }

/* CRT Scanline ve Grid Efekti */
body::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: 9999; background-size: 100% 3px, 6px 100%; pointer-events: none; }

#err-banner { display: none; background: var(--neon-magenta); color: #fff; font-size: .75rem; padding: 6px 12px; user-select: text; -webkit-user-select: text; flex-shrink: 0; font-family: 'Orbitron', monospace; }

/* HEADER / HUD BARI */
header { background: #0c0f1d; padding: 8px 12px; border-bottom: 2px solid var(--neon-cyan); box-shadow: 0 0 15px var(--border-glow); flex-shrink: 0; z-index: 10; }
.header-title-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
h1 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: clamp(0.9rem, 2.5vw, 1.3rem); color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px var(--neon-cyan); }
.status-tag { font-family: 'Orbitron', monospace; font-size: 0.65rem; background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 2px 6px; border-radius: 3px; }

.demo-bar { display: flex; gap: 6px; justify-content: center; align-items: center; width: 100%; flex-wrap: wrap; margin-bottom: 6px; }
.demo-field { display: flex; flex-direction: column; align-items: flex-start; }
.demo-field label { font-size: 0.6rem; color: #8892b0; margin-bottom: 2px; font-weight: bold; text-transform: uppercase; font-family: 'Orbitron', sans-serif; }
.demo-field input, .demo-field select { background: #13172b; color: var(--neon-cyan); border: 1px solid rgba(0, 243, 255, 0.4); padding: 4px 6px; border-radius: 4px; font-size: clamp(.65rem, 2vw, .8rem); outline: none; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
.demo-field input:focus, .demo-field select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

.panel-row { display: flex; gap: 6px; justify-content: center; align-items: center; width: 100%; }
#module-select, #mode-select { background: #13172b; color: #fff; border: 1px solid var(--neon-cyan); padding: 6px 10px; border-radius: 4px; font-size: clamp(.75rem, 2.5vw, .9rem); outline: none; font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase; }
#module-select { flex: 1; max-width: 360px; color: var(--neon-cyan); }
#mode-select { flex: 0 0 auto; max-width: 180px; color: var(--neon-yellow); border-color: var(--neon-yellow); }

.extra-options { display: none; gap: 10px; justify-content: center; align-items: center; margin-top: 5px; font-size: .75rem; color: var(--neon-cyan); font-family: 'Orbitron', monospace; }
.extra-options select { background: #13172b; color: #fff; border: 1px solid var(--neon-cyan); padding: 2px 6px; border-radius: 4px; }
.consent-row { margin-top: 5px; font-size: .65rem; color: #64748b; display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
#sync-status { color: var(--neon-green); font-weight: bold; }

/* STATS BAR / TELEMETRİ PANELLLERİ */
#stats-bar { display: flex; justify-content: space-around; background: #080a14; padding: 8px 12px; font-size: clamp(.7rem, 2.2vw, .85rem); font-family: 'Orbitron', sans-serif; font-weight: bold; border-bottom: 1px solid #1a233a; flex-shrink: 0; }
.stat-item { color: #8892b0; text-transform: uppercase; letter-spacing: 1px; }
.stat-item span { color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
#stat-errors { color: var(--neon-magenta) !important; text-shadow: 0 0 5px var(--neon-magenta); }

/* OYUN ALANI / SİMÜLASYON KAPSÜLÜ */
#game-area { flex: 1; position: relative; width: 100%; overflow: hidden; background: radial-gradient(circle at center, #101426 0%, #05060a 100%); display: flex; justify-content: center; align-items: center; padding: 10px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
#game-area.has-buttons { padding-bottom: 95px; }

@keyframes fbok { 0% { box-shadow: inset 0 0 30px var(--neon-green); } 100% { box-shadow: inset 0 0 0 transparent; } }
@keyframes fbbad { 0% { box-shadow: inset 0 0 30px var(--neon-magenta); } 100% { box-shadow: inset 0 0 0 transparent; } }
#game-area.fb-ok { animation: fbok .4s; }
#game-area.fb-bad { animation: fbbad .4s; }

/* GÖREV KARTI (INSTRUCTION CARD) */
#instruction-card { position: absolute; width: min(92%, 500px); max-height: 90%; overflow-y: auto; background: var(--panel-bg); backdrop-filter: blur(10px); border: 2px solid var(--neon-cyan); padding: 20px; border-radius: 8px; text-align: left; z-index: 1000; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); }
#instruction-card h3 { margin-top: 0; color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; font-size: clamp(1rem, 3.5vw, 1.3rem); text-align: center; text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 0 10px var(--neon-cyan); border-bottom: 1px solid var(--border-glow); padding-bottom: 8px; }
#instruction-card p { font-size: clamp(.8rem, 2.6vw, .95rem); line-height: 1.6; color: #d8dee9; margin-bottom: 10px; font-weight: 500; }
.eval-info { background: rgba(0, 243, 255, 0.05); border-left: 3px solid var(--neon-cyan); padding: 8px 10px; font-size: .78rem; color: #81a1c1; margin-top: 8px; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
.score-info { background: rgba(0, 255, 102, 0.05); border-left: 3px solid var(--neon-green); padding: 8px 10px; font-size: .78rem; color: #a3be8c; margin-top: 8px; font-family: 'Rajdhani', sans-serif; font-weight: 600; }

/* DOKUNMATİK UNUTLAR & ELEMANLAR */
#antisaccade-touch-zone { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 50; }
.antisaccade-half { position: absolute; width: 50%; height: 100%; top: 0; }
#antisaccade-left-zone { left: 0; border-right: 1px dashed rgba(0, 243, 255, 0.2); }
#antisaccade-right-zone { right: 0; }

#dual-buttons { display: none; width: calc(100% - 20px); max-width: 420px; gap: 20px; justify-content: center; z-index: 100; position: absolute; bottom: 20px; }
.choice-btn { flex: 1; padding: 18px 0; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; border-radius: 6px; border: 2px solid #fff; text-align: center; color: #fff; text-shadow: 0 0 5px #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.btn-left { background: linear-gradient(135deg, #ff0055, #990033); border-color: var(--neon-magenta); }
.btn-right { background: linear-gradient(135deg, #00d2ff, #006699); border-color: var(--neon-cyan); }

#target-circle { position: absolute; transform: translate(-50%, -50%); width: clamp(110px, 25vw, 150px); height: clamp(110px, 25vw, 150px); border-radius: 50%; background: #000; border: 3px solid #fff; display: none; justify-content: center; align-items: center; font-family: 'Orbitron', sans-serif; font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 900; text-align: center; padding: 8px; z-index: 200; box-shadow: 0 0 25px rgba(255, 255, 255, 0.3); }
#target-circle.wide { width: auto; height: auto; min-width: 160px; border-radius: 12px; padding: 16px 24px; letter-spacing: 2px; white-space: nowrap; }

#spatial-grid { display: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; width: 100%; height: 100%; max-width: 480px; max-height: 480px; margin: auto; z-index: 100; }
#spatial-grid.compact { height: 50%; align-self: flex-end; }
.spatial-btn { border-radius: 10px; opacity: .25; transition: opacity .15s, transform .1s; display: flex; justify-content: center; align-items: center; font-family: 'Orbitron', sans-serif; font-size: clamp(1.2rem, 4vw, 1.8rem); font-weight: 900; color: #000; border: 2px solid #fff; width: 100%; height: 100%; }
.spatial-btn.active { opacity: 1; box-shadow: 0 0 35px #fff; transform: scale(.96); }
#spatial-grid.all-on .spatial-btn { opacity: 0.85; }

#memory-grid { display: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; width: min(75vw, 300px); aspect-ratio: 1; margin: auto; z-index: 100; }
.memory-block { background: #121829; border: 2px solid var(--neon-cyan); border-radius: 8px; width: 100%; height: 100%; transition: background .1s; }
.memory-block.lit { background: var(--neon-cyan) !important; box-shadow: 0 0 30px var(--neon-cyan) !important; }

#numpad-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(80vw, 280px); margin: auto; z-index: 100; }
.num-btn { background: #121829; border: 1px solid var(--neon-cyan); color: #fff; font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: bold; padding: 14px 0; border-radius: 6px; text-align: center; }
.num-btn:active { background: var(--neon-cyan); color: #000; }

#trail-area { display: none; position: relative; width: 100%; align-self: stretch; flex: 1; z-index: 100; }
#trail-area svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.trail-node { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: #101625; color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.1rem; display: flex; justify-content: center; align-items: center; border: 2px solid var(--neon-cyan); z-index: 2; box-shadow: 0 0 10px rgba(0,243,255,0.3); }
.trail-node.done { background: var(--neon-green); color: #000; border-color: var(--neon-green); opacity: .4; box-shadow: none; }

#cv { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; touch-action: none; }

/* BONTROL BUTONLARI */
#controls { padding: 10px; background: #0c0f1d; display: flex; gap: 8px; justify-content: center; flex-shrink: 0; border-top: 1px solid #1a233a; width: 100%; }
button { flex: 1; max-width: 150px; min-height: 46px; padding: 8px 0; font-family: 'Orbitron', sans-serif; font-size: clamp(.65rem, 2.2vw, .85rem); font-weight: 700; border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: #fff; text-transform: uppercase; letter-spacing: 1px; transition: all .2s; }
.btn-start { background: linear-gradient(135deg, #00b33c, #006622); border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
.btn-stop { background: linear-gradient(135deg, #b3003b, #660022); border-color: var(--neon-magenta); }
.btn-export { background: linear-gradient(135deg, #0088cc, #004466); border-color: var(--neon-cyan); }
.btn-report { background: linear-gradient(135deg, #8800cc, #440066); border-color: #d800ff; }
.btn-mute { background: #1a233a; border-color: #3b4252; max-width: 90px; }
button:disabled { background: #181c2b !important; border-color: #2e3440 !important; color: #4c566a !important; box-shadow: none !important; cursor: not-allowed; }

/* RAPOR OVERLAY (CYBERPUNK RAPOR PANELLİ) */
#report-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 5000; background: #080a12; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#report-overlay.open { display: block; }
#report-overlay * { user-select: text; -webkit-user-select: text; }
#report-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #0c0f1d; border-bottom: 2px solid var(--neon-cyan); padding: 8px 12px; z-index: 2; }
#report-bar b { color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; font-size: .95rem; letter-spacing: 1px; }
#report-bar span { display: flex; gap: 6px; }
#report-bar button { flex: none; min-height: 38px; padding: 6px 14px; max-width: none; background: #1a233a; border: 1px solid var(--neon-cyan); }
#report-body { max-width: 800px; margin: 0 auto; padding: 16px; font-size: .85rem; line-height: 1.6; color: #d8dee9; font-family: 'Rajdhani', sans-serif; }
.rp-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: var(--neon-cyan); font-weight: 900; letter-spacing: 1.5px; }
.rp-sub { color: #8892b0; font-size: .8rem; font-weight: 600; }
.rp-sec { border-top: 1px solid #1a233a; margin-top: 16px; padding-top: 12px; }
.rp-sec h4 { margin: 0 0 8px; color: var(--neon-yellow); font-family: 'Orbitron', sans-serif; font-size: .95rem; letter-spacing: 1px; }
.rp-sec ul { margin: 0; padding-left: 20px; }
.rp-card { border: 1px solid #1a233a; background: #0d1120; padding: 12px; margin-top: 12px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.rp-ct { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: 'Orbitron', sans-serif; font-weight: bold; color: var(--neon-cyan); font-size: .9rem; }
.rp-ct span { font-family: 'Rajdhani', sans-serif; font-weight: 600; color: #8892b0; font-size: .75rem; }
.rp-card table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: .8rem; }
.rp-card td { border-bottom: 1px solid #161c2e; padding: 4px 6px; vertical-align: top; }
.rp-card td:first-child { color: #8892b0; width: 48%; font-weight: 600; }
.rp-cm { border-left: 3px solid; padding: 4px 10px; margin: 6px 0; background: rgba(255,255,255,0.02); }
.rp-tr { color: #b39ddb; font-size: .8rem; margin-top: 6px; font-weight: 600; }
.rp-note { color: #4c566a; font-size: .75rem; margin-top: 16px; border-top: 1px dashed #1a233a; padding-top: 8px; }

@media print {
  html, body { height: auto !important; overflow: visible !important; display: block !important; background: #fff !important; color: #000 !important; }
  body > *:not(#report-overlay) { display: none !important; }
  #report-overlay.open { position: static !important; background: #fff !important; overflow: visible !important; }
  #report-bar { display: none !important; }
  #report-body, #report-body * { color: #000 !important; background: transparent !important; border-color: #ccc !important; text-shadow: none !important; }
  .rp-card { break-inside: avoid; border: 1px solid #000 !important; }
}
</style>
</head>
<body>
<div id="err-banner"></div>

<header>
  <div class="header-title-box">
    <h1>NEURO-CORE // LAB</h1>
    <span class="status-tag">SIMÜLASYON AKTİF</span>
  </div>
  <div class="demo-bar">
    <div class="demo-field"><label>Siber ID</label><input type="text" id="athlete-id" value="AGENT-101" maxlength="32" style="width:95px"></div>
    <div class="demo-field"><label>Yaş</label><input type="number" id="athlete-age" value="22" min="5" max="99" style="width:45px"></div>
    <div class="demo-field"><label>Cinsiyet</label><select id="athlete-gender" style="width:65px"><option value="Erkek">Erkek</option><option value="Kadin">Kadın</option></select></div>
    <div class="demo-field"><label>Uzmanlık</label><input type="text" id="athlete-sport" value="Taktik" maxlength="32" style="width:75px"></div>
    <div class="demo-field"><label>Baskın El</label><select id="athlete-dominant" style="width:55px"><option value="Sag">Sağ</option><option value="Sol">Sol</option></select></div>
    <div class="demo-field"><label>Deneyim</label><input type="number" id="athlete-exp" value="5" min="0" max="80" style="width:50px"></div>
  </div>
  <div class="panel-row">
    <select id="module-select">
      <optgroup label="A. Bilişsel İnhibisyon & Çatışma">
        <option value="gonogo">1. Go/No-Go (Baskılama)</option>
        <option value="stroop">2. Stroop (Renk-Kelime Çelişkisi)</option>
        <option value="simon">3. Simon Effect (Mekânsal Çatışma)</option>
        <option value="flanker">4. Flanker Testi (Çeldirici Dikkat)</option>
        <option value="antisaccade">5. Anti-Saccade (Refleks Baskılama)</option>
      </optgroup>
      <optgroup label="B. Nöropsikolojik & Bellek">
        <option value="trailA">6. Trail Making A (1-20 Sayı)</option>
        <option value="trailB">7. Trail Making B (1-A-2-B...)</option>
        <option value="memory">8. Görsel Dizilim Bellek (Corsi)</option>
        <option value="nback">9. Spatial N-Back Bellek</option>
        <option value="digit_span">10. Görsel Sayı Dizilimi Belleği</option>
      </optgroup>
      <optgroup label="C. Saha & Kinetik Depar">
        <option value="sprint_ball">11. Saha Depar: Top Getirme</option>
        <option value="agility_run">12. Renk Koni Çeviklik Deparı</option>
        <option value="complex_agility">13. Karmaşık Çift Komut Deparı (Go/No-Go)</option>
        <option value="choice_react">14. Çoklu Seçenek Reaksiyon Deparı</option>
        <option value="visual_search">15. Görsel Arama & Depar</option>
      </optgroup>
      <optgroup label="D. Uyanıklık, Zamanlama & Dikkat">
        <option value="pvt">16. Basit Reaksiyon (PVT - Uyanıklık)</option>
        <option value="stopsignal">17. Stop-Signal (Eylem Durdurma)</option>
        <option value="taskswitch">18. Görev Değiştirme (Esneklik)</option>
        <option value="mot">19. Çoklu Nesne Takibi (MOT)</option>
        <option value="timing">20. Öngörü Zamanlaması (Anticipation)</option>
      </optgroup>
    </select>
    <select id="mode-select">
      <option value="quick">Hızlı Tarama</option>
      <option value="rel">Tam Kalibrasyon</option>
    </select>
  </div>
  <div class="extra-options" id="opt-digit"><label>Başlangıç Matrisi: </label><select id="digit-length-select"><option value="4">4 Basamak (Standart)</option><option value="8">8 Basamak (Gelişmiş)</option></select></div>
  <div class="extra-options" id="opt-nback"><label>N-Derinliği: </label><select id="nback-n-select"><option value="1">1-back</option><option value="2">2-back</option><option value="3">3-back</option></select></div>
  <div class="consent-row"><label><input type="checkbox" id="consent"> Telemetri verilerini ana sunucuya senkronize et.</label><span id="sync-status"></span></div>
</header>

<div id="stats-bar">
  <div class="stat-item">SEANS: <span id="stat-trials">0/10</span></div>
  <div class="stat-item">SÜRE: <span id="stat-timer">0.00 s</span></div>
  <div class="stat-item">NEURO-SKOR: <span id="stat-score">0</span></div>
  <div class="stat-item">SAPMA: <span id="stat-errors">0</span></div>
</div>

<div id="game-area">
  <div id="instruction-card">
    <h3 id="instr-title">Simülasyon Yönergesi</h3>
    <p id="instr-text">Veri yükleniyor...</p>
    <div id="instr-eval" class="eval-info"></div>
    <div id="instr-score-formula" class="score-info"></div>
  </div>
  <div id="antisaccade-touch-zone">
    <div id="antisaccade-left-zone" class="antisaccade-half"></div>
    <div id="antisaccade-right-zone" class="antisaccade-half"></div>
  </div>
  <canvas id="cv"></canvas>
  <div id="target-circle"></div>
  <div id="dual-buttons">
    <div class="choice-btn btn-left" id="btn-left-opt">SOL</div>
    <div class="choice-btn btn-right" id="btn-right-opt">SAĞ</div>
  </div>
  <div id="spatial-grid">
    <div class="spatial-btn" data-key="red" style="background:#ff0055"></div>
    <div class="spatial-btn" data-key="blue" style="background:#00d2ff"></div>
    <div class="spatial-btn" data-key="green" style="background:#00ff66"></div>
    <div class="spatial-btn" data-key="yellow" style="background:#ffcc00"></div>
  </div>
  <div id="memory-grid"></div>
  <div id="numpad-grid"></div>
  <div id="trail-area"></div>
</div>

<div id="controls">
  <button id="start-btn" class="btn-start">BAŞLAT</button>
  <button id="stop-btn" class="btn-stop" disabled>DURDUR</button>
  <button id="export-btn" class="btn-export" disabled>CSV AKTAR</button>
  <button id="report-btn" class="btn-report">ANALİZ</button>
  <button id="mute-btn" class="btn-mute">SES: AÇIK</button>
</div>

<div id="report-overlay">
  <div id="report-bar">
    <b>NÖRO-BİLİŞSEL PERFORMANS MATRİSİ</b>
    <span>
      <button id="rep-print">YAZDIR</button>
      <button id="rep-copy">KOPYALA</button>
      <button id="rep-close">KAPAT</button>
    </span>
  </div>
  <div id="report-body"></div>
</div>

<!-- ORİJİNAL KODUN TÜM JS MANTIĞI VE FONKSİYONLARI BURAYA BİREBİR EKLENİR -->
