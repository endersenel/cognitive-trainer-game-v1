<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPPLab Kids - Bilişsel Akademi</title>
<style>
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body{margin:0;padding:0;background:#12131C;color:#fff;font-family:'Comic Sans MS', 'Segoe UI', sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* Oyun Başlığı & XP Panosu */
  header{background:#1E202F;padding:10px;border-bottom:3px solid #FFD700;display:flex;justify-content:space-between;align-items:center}
  .player-profile{display:flex;align-items:center;gap:10px}
  .avatar{width:45px;height:45px;background:#FFD700;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px}
  .level-info{display:flex;flex-direction:column}
  .level-title{font-size:0.75rem;color:#AAA}
  .level-name{font-size:0.95rem;font-weight:bold;color:#FFD700}

  /* XP Bar */
  .xp-container{width:140px;background:#2A2D40;height:14px;border-radius:7px;overflow:hidden;border:1px solid #FFD700;position:relative}
  .xp-bar{width:0%;height:100%;background:linear-gradient(90deg, #FFD700, #FF5722);transition:width 0.3s}
  .xp-text{position:absolute;width:100%;text-align:center;font-size:9px;line-height:14px;font-weight:bold;color:#FFF;text-shadow:1px 1px #000}

  /* Ana Oyun Seçim Alanı */
  #game-area{flex:1;position:relative;display:flex;justify-content:center;align-items:center;padding:15px;background:#181A26}
  
  /* Modül Seçim Kartları */
  .game-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;width:100%;max-width:600px}
  .game-card{background:#232638;border:2px solid #3B3E5B;border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:transform 0.1s, border-color 0.2s}
  .game-card:hover{transform:scale(1.03);border-color:#FFD700}
  .game-card .icon{font-size:36px;margin-bottom:6px}
  .game-card .title{font-size:0.85rem;font-weight:bold;color:#FFF}
  .game-card .category{font-size:0.65rem;color:#00E5FF;margin-top:4px}

  /* Rozet Paneli Modal */
  #badge-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:2000;justify-content:center;align-items:center}
  .modal-content{background:#1E202F;border:3px solid #FFD700;border-radius:20px;padding:20px;width:90%;max-width:400px;text-align:center}
  .badge-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin:15px 0}
  .badge-item{background:#2A2D40;padding:10px;border-radius:12px;opacity:0.3;filter:grayscale(1)}
  .badge-item.unlocked{opacity:1;filter:none;border:1px solid #FFD700}
  .badge-item .b-icon{font-size:28px}
  .badge-item .b-name{font-size:0.65rem;margin-top:4px;color:#FFF}

  /* Kontrol Butonları */
  footer{padding:10px;background:#1E202F;display:flex;gap:10px;justify-content:center;border-top:1px solid #333}
  .btn{padding:10px 16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;color:#FFF;background:#29B6F6}
  .btn-gold{background:#FFD700;color:#000}
</style>
</head>
<body>

<header>
  <div class="player-profile">
    <div class="avatar">🦊</div>
    <div class="level-info">
      <span class="level-title">Sınıf / Seviye <span id="lvl-num">1</span></span>
      <span class="level-name" id="lvl-name">Çaylak İzcisi</span>
    </div>
  </div>
  <div>
    <div class="xp-container">
      <div class="xp-bar" id="xp-bar"></div>
      <div class="xp-text" id="xp-text">0 / 500 XP</div>
    </div>
  </div>
</header>

<div id="game-area">
  <!-- Oyun Modül Listesi -->
  <div class="game-grid" id="menu-grid">
    <div class="game-card" onclick="launchGame('gonogo', 'Köstebek Yakalama', 150)">
      <div class="icon">🐹</div>
      <div class="title">Köstebek Yakalama</div>
      <div class="category">Go/No-Go İnhibisyon</div>
    </div>
    <div class="game-card" onclick="launchGame('stroop', 'Sihirli İksirler', 200)">
      <div class="icon">🧪</div>
      <div class="title">Sihirli İksirler</div>
      <div class="category">Stroop Çatışma</div>
    </div>
    <div class="game-card" onclick="launchGame('trailA', 'Yıldız Birleştirme', 180)">
      <div class="icon">⭐</div>
      <div class="title">Yıldız Birleştirme</div>
      <div class="category">Trail Making A</div>
    </div>
    <div class="game-card" onclick="launchGame('mot', 'Kayıp Denizanaları', 250)">
      <div class="icon">🪼</div>
      <div class="title">Kayıp Denizanaları</div>
      <div class="category">Çoklu Nesne Takibi</div>
    </div>
  </div>
</div>

<footer>
  <button class="btn btn-gold" onclick="openBadges()">🏆 Madalyalarım</button>
  <button class="btn" onclick="resetProgress()">🔄 İlerlemeyi Sıfırla</button>
</footer>

<!-- Madalya Penceresi -->
<div id="badge-modal">
  <div class="modal-content">
    <h3 style="color:#FFD700;margin-top:0;">Kazanılan Madalyalar</h3>
    <div class="badge-grid">
      <div class="badge-item" id="badge-1">
        <div class="b-icon">⚡</div>
        <div class="b-name">Işık Hızı</div>
      </div>
      <div class="badge-item" id="badge-2">
        <div class="b-icon">🎯</div>
        <div class="b-name">Keskin Göz</div>
      </div>
      <div class="badge-item" id="badge-3">
        <div class="b-icon">🧠</div>
        <div class="b-name">Zihin Ustası</div>
      </div>
    </div>
    <button class="btn" onclick="closeBadges()">Kapat</button>
  </div>
</div>

<script>
// Oyuncu İlerleme Durumu
const Player = {
  xp: 0,
  level: 1,
  badges: new Set(),
  titles: [
    "Çaylak İzcisi",
    "Refleks Çırağı",
    "Dikkat Avcısı",
    "Hız Şampiyonu",
    "Nöro Kaptan",
    "Zihin Ustası"
  ]
};

function addXP(amount) {
  Player.xp += amount;
  const nextLvlXp = Player.level * 500;
  
  if (Player.xp >= nextLvlXp) {
    Player.level++;
    if (Player.level > Player.titles.length) Player.level = Player.titles.length;
    alert(`🎉 TEBRİKLER! SEVİYE ATLADIN!\nYeni Unvanın: ${Player.titles[Player.level - 1]}`);
  }
  
  updateUI();
  checkBadges();
}

function updateUI() {
  const currentLvlBase = (Player.level - 1) * 500;
  const nextLvlTarget = Player.level * 500;
  const progress = ((Player.xp - currentLvlBase) / (nextLvlTarget - currentLvlBase)) * 100;
  
  document.getElementById('xp-bar').style.width = Math.min(100, Math.max(0, progress)) + '%';
  document.getElementById('xp-text').textContent = `${Player.xp} / ${nextLvlTarget} XP`;
  document.getElementById('lvl-num').textContent = Player.level;
  document.getElementById('lvl-name').textContent = Player.titles[Player.level - 1];
}

function checkBadges() {
  if (Player.xp >= 150) unlockBadge('badge-1');
  if (Player.xp >= 500) unlockBadge('badge-2');
  if (Player.xp >= 1200) unlockBadge('badge-3');
}

function unlockBadge(id) {
  const el = document.getElementById(id);
  if (el && !el.classList.contains('unlocked')) {
    el.classList.add('unlocked');
  }
}

function launchGame(modKey, gameTitle, rewardXp) {
  // Test tamamlama simülasyonu (Mevcut SPPLab motoruna bağlanacak kısım)
  alert(`"${gameTitle}" Oyunu Başlatılıyor!\n\nTamamladığında +${rewardXp} XP kazanacaksın.`);
  
  // Örnek: Test başarıyla tamamlandığinde tetiklenen event
  setTimeout(() => {
    addXP(rewardXp);
  }, 1000);
}

function openBadges() { document.getElementById('badge-modal').style.display = 'flex'; }
function closeBadges() { document.getElementById('badge-modal').style.display = 'none'; }
function resetProgress() {
  Player.xp = 0;
  Player.level = 1;
  updateUI();
}

updateUI();
</script>
</body>
</html>
